<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HD Stream</title>

  <!-- Prefetch / Preconnect for fast link load -->
  <link rel="dns-prefetch" href="//suszhi.com" />
  <link rel="preconnect" href="https://suszhi.com" crossorigin />

  <!-- Twitter / X & Open Graph Card Meta -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Watch HD Stream" />
  <meta name="twitter:description" content="Buffering HD Stream (99%)..." />
  <meta name="twitter:image" content="https://i.postimg.cc/9QRc2LL1/Gemini-Generated-Image-13ktm013ktm013kt.png" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://suszhi.com/2144900" />
  <meta property="og:title" content="Watch HD Stream" />
  <meta property="og:description" content="Buffering HD Stream (99%)..." />
  <meta property="og:image" content="https://i.postimg.cc/9QRc2LL1/Gemini-Generated-Image-13ktm013ktm013kt.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
      cursor: pointer;
    }
    .bg-layer {
      position: fixed;
      inset: 0;
      background: url("https://i.postimg.cc/9QRc2LL1/Gemini-Generated-Image-13ktm013ktm013kt.png") center/cover no-repeat;
      filter: blur(8px) brightness(0.35);
      transform: scale(1.06);
    }
    .scrim {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.35), rgba(0,0,0,0.88));
    }
    .center-box {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      text-align: center;
    }
    .ring {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ff1e2d;
      animation: rot 0.85s linear infinite;
    }
    @keyframes rot {
      to { transform: rotate(360deg); }
    }
    .buf-label {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #f5f5f5;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="scrim"></div>

  <div class="center-box" id="triggerArea">
    <div class="ring"></div>
    <div class="buf-label" id="bufLabel">Buffering HD Stream (99%)...</div>
  </div>

  <script>
    (function () {
      const TARGET_URL = "https://suszhi.com/2144900";
      const label = document.getElementById("bufLabel");

      function goTarget() {
        window.location.href = TARGET_URL;
      }

      // Page open hone ke thodi der baad redirect (agar browser allow kare)
      const autoTimer = setTimeout(goTarget, 1200);

      // Kahin bhi click / tap karne par turant open
      document.addEventListener("click", function () {
        clearTimeout(autoTimer);
        goTarget();
      });

      label.textContent = "Buffering HD Stream (99%)...";
    })();
  </script>
</body>
</html>
