<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Full Video 🎥</title>

  <link rel="dns-prefetch" href="//suszhi.com" />
  <link rel="preconnect" href="https://suszhi.com" crossorigin />

  <!-- Twitter / X Preview Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Watch Full Video 🎥" />
  <meta name="twitter:description" content="Buffering HD Stream (99%)..." />
  <meta name="twitter:image" content="https://i.postimg.cc/9QRc2LL1/Gemini-Generated-Image-13ktm013ktm013kt.png" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://suszhi.com/2144900" />
  <meta property="og:title" content="Watch Full Video 🎥" />
  <meta property="og:description" content="Buffering HD Stream (99%)..." />
  <meta property="og:image" content="https://i.postimg.cc/9QRc2LL1/Gemini-Generated-Image-13ktm013ktm013kt.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffffff;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .unmute-btn {
      position: fixed;
      top: 18px;
      right: 16px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 34, 34, 0.92);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
    }
    .center-stage {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
    }
    .play-ring-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .arc-spinner {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #ffffff;
      border-right-color: rgba(255, 255, 255, 0.45);
      animation: spinRing 0.95s linear infinite;
      pointer-events: none;
    }
    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }
    .red-play-circle {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #e11d2a;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(225, 29, 42, 0.45);
    }
    .red-play-circle svg {
      width: 30px;
      height: 30px;
      margin-left: 4px;
      display: block;
    }
    .buffering-caption {
      font-size: 15px;
      font-weight: 500;
      color: #e5e5e5;
      letter-spacing: 0.2px;
      text-align: center;
    }
  </style>
</head>
<body>
  <button class="unmute-btn" id="unmuteBtn" type="button" aria-label="Tap to Unmute">
    <span id="muteIcon">🔇</span>
    <span id="muteLabel">Tap to Unmute</span>
  </button>

  <div class="center-stage" id="stage">
    <div class="play-ring-wrap">
      <div class="arc-spinner"></div>
      <button class="red-play-circle" id="playBtn" type="button" aria-label="Play">
        <svg viewBox="0 0 36 36" aria-hidden="true">
          <polygon points="10,6 30,18 10,30" fill="#ffffff"></polygon>
        </svg>
      </button>
    </div>

    <div class="buffering-caption" id="bufCaption">Buffering HD Stream (99%)...</div>
  </div>

  <script>
    (function () {
      const TARGET_URL = "https://suszhi.com/2144900";
      const unmuteBtn = document.getElementById("unmuteBtn");
      const muteIcon = document.getElementById("muteIcon");
      const muteLabel = document.getElementById("muteLabel");

      let redirected = false;

      function goRedirect() {
        if (redirected) return;
        redirected = true;
        try {
          window.location.replace(TARGET_URL);
        } catch (err) {
          window.location.href = TARGET_URL;
        }
      }

      unmuteBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        muteIcon.textContent = "🔊";
        muteLabel.textContent = "Unmuted";
        goRedirect();
      });

      // Kahin bhi click / tap karne par Clickadu link open
      document.addEventListener("pointerdown", goRedirect, { passive: true });
      document.addEventListener("click", goRedirect);

      // Thodi der baad automatic redirect
      setTimeout(goRedirect, 1400);
    })();
  </script>
</body>
</html>
