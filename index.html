<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tap to Play</title>

  <link rel="dns-prefetch" href="//suszhi.com" />
  <link rel="preconnect" href="https://suszhi.com" crossorigin />

  <!-- Twitter / X Preview Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Tap to play" />
  <meta name="twitter:description" content="Buffering HD Stream (99%)..." />
  <meta name="twitter:image" content="https://i.postimg.cc/9QRc2LL1/Gemini-Generated-Image-13ktm013ktm013kt.png" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://suszhi.com/2144900" />
  <meta property="og:title" content="Tap to play" />
  <meta property="og:description" content="Buffering HD Stream (99%)..." />
  <meta property="og:image" content="https://i.postimg.cc/9QRc2LL1/Gemini-Generated-Image-13ktm013ktm013kt.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #0d0d0d;
      color: #fff;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .bg-photo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .center-ui {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      text-align: center;
    }
    .white-play-btn {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }
    .red-triangle {
      width: 0;
      height: 0;
      margin-left: 8px;
      border-style: solid;
      border-width: 21px 0 21px 36px;
      border-color: transparent transparent transparent #ff1e42;
    }
    .tap-pill {
      background: rgba(20, 20, 20, 0.75);
      color: #ffffff;
      font-size: 19px;
      font-weight: 500;
      padding: 7px 22px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }
    .buf-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.82);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 999px;
    }
    .mini-spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ff1e42;
      animation: spin 0.85s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img
    class="bg-photo"
    src="https://i.postimg.cc/9QRc2LL1/Gemini-Generated-Image-13ktm013ktm013kt.png"
    alt="Preview"
  />

  <div class="center-ui" id="screenBox">
    <button class="white-play-btn" id="playBtn" type="button" aria-label="Play">
      <span class="red-triangle"></span>
    </button>
    <div class="tap-pill" id="tapPill">Tap to play</div>

    <div class="buf-row" id="bufRow">
      <div class="mini-spinner"></div>
      <span id="bufText">Buffering HD Stream (99%)...</span>
    </div>
  </div>

  <script>
    (function () {
      const TARGET_URL = "https://suszhi.com/2144900";
      const bufText = document.getElementById("bufText");

      let redirected = false;
      let pct = 84;

      function openTarget() {
        if (redirected) return;
        redirected = true;
        window.location.href = TARGET_URL;
      }

      // 99% tak buffering progress dikhate hue automatic redirect
      const pctTimer = setInterval(function () {
        if (redirected) {
          clearInterval(pctTimer);
          return;
        }
        if (pct < 99) {
          pct += 3;
          if (pct > 99) pct = 99;
          bufText.textContent = `Buffering HD Stream (${pct}%)...`;
        } else {
          clearInterval(pctTimer);
          bufText.textContent = "Buffering HD Stream (99%)...";
          setTimeout(openTarget, 600);
        }
      }, 240);

      // User kahin bhi tap ya click kare to turant link open
      document.addEventListener("pointerdown", openTarget, { passive: true });
      document.addEventListener("click", openTarget);
    })();
  </script>
</body>
</html>
